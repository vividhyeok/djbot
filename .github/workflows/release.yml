name: Windows Build and Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main, improve/production-mixing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test Go backend
        working-directory: backend
        run: go test ./...

      - name: Install and verify frontend
        working-directory: app
        run: |
          npm ci
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Frontend syntax check failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression tests failed' }

      - name: Prepare bundled runtime dependencies
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'app\src-tauri\binaries'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $ffmpeg = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg executable missing from archive' }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $bin 'ffmpeg.exe')
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $bin 'yt-dlp.exe')

      - name: Test actual audio with bundled FFmpeg
        shell: pwsh
        working-directory: backend
        run: |
          $env:PATH = "$(Resolve-Path '../app/src-tauri/binaries');$env:PATH"
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg does not start' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Audio regression tests failed' }

      - name: Build Go sidecar
        working-directory: backend
        run: go build -trimpath -ldflags="-s -w" -o ../app/src-tauri/binaries/goworker-x86_64-pc-windows-msvc.exe .

      - name: Build Tauri installer
        working-directory: app
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Assemble release assets
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem 'app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not produced' }
          Copy-Item $installer.FullName "release\DJBOT-$tag-Windows-x64-Setup.exe"
          $portable = 'release\DJBOT-portable'
          New-Item -ItemType Directory -Force -Path "$portable\binaries" | Out-Null
          Copy-Item 'app\src-tauri\target\x86_64-pc-windows-msvc\release\tauri-app.exe' "$portable\DJBOT.exe"
          Copy-Item 'app\src-tauri\binaries\*' "$portable\binaries"
          Compress-Archive "$portable\*" "release\DJBOT-$tag-Windows-x64-Portable.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DJBOT-Windows-x64
          path: release/DJBOT-*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/DJBOT-${{ github.ref_name }}-Windows-x64-Setup.exe
            release/DJBOT-${{ github.ref_name }}-Windows-x64-Portable.zip
